<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 500px; overflow: hidden; }
  body {
    background: #0b0e14;
    font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', ui-monospace, monospace;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* faint grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  /* soft violet glow, top-right */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(900px 420px at 78% 12%, rgba(139, 92, 246, 0.14), transparent 65%);
  }

  .term {
    position: relative;
    width: 1180px;
    border: 1px solid #232b3a;
    border-radius: 12px;
    background: #0e1219;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }
  /* title bar */
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 18px;
    background: #121722;
    border-bottom: 1px solid #232b3a;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #f85149; }
  .dot.y { background: #d29922; }
  .dot.g { background: #3fb950; }
  .bar .title {
    margin-left: 14px;
    font-size: 14px;
    color: #7d8590;
    letter-spacing: 0.4px;
    font-weight: 500;
  }
  .bar .tag {
    margin-left: auto;
    font-size: 12px;
    color: #6e7681;
    background: #1b2230;
    border: 1px solid #2a3346;
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 0.3px;
  }

  .body { padding: 38px 52px 44px; }
  .prompt { font-size: 21px; color: #b8c2cf; }
  .prompt .dollar { color: #8b5cf6; font-weight: 700; }
  .prompt .cmd { color: #e6edf3; font-weight: 700; }
  .prompt .arg { color: #9ca3af; }

  .files { margin: 30px 0 0 26px; display: flex; flex-direction: column; gap: 20px; }
  .line { display: flex; align-items: baseline; gap: 18px; font-size: 20px; }
  .line .ok { color: #3fb950; font-weight: 700; }
  .line .file { color: #a78bfa; font-weight: 700; }
  .line .dash { color: #4b5563; }
  .line .what { color: #d1d5db; }
  .line .hl { color: #8b5cf6; }

  .foot {
    margin-top: 26px;
    font-size: 15px;
    color: #6e7681;
    padding-left: 26px;
  }
  .foot b { color: #9ca3af; font-weight: 600; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="term">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">hermes — onboarding a fresh agent</span>
      <span class="tag">SOUL · USER · MEMORY · AGENTS</span>
    </div>
    <div class="body">
      <div class="prompt"><span class="dollar">$</span> <span class="cmd">hermes identity setup</span> <span class="arg">--interview</span></div>
      <div class="files">
        <div class="line"><span class="ok">✓</span><span class="file">SOUL.md</span><span class="dash">→</span><span class="what">who the agent <span class="hl">IS</span></span></div>
        <div class="line"><span class="ok">✓</span><span class="file">USER.md</span><span class="dash">→</span><span class="what">who <span class="hl">you</span> are</span></div>
        <div class="line"><span class="ok">✓</span><span class="file">MEMORY.md</span><span class="dash">→</span><span class="what">what the agent has <span class="hl">learned</span></span></div>
        <div class="line"><span class="ok">✓</span><span class="file">AGENTS.md</span><span class="dash">→</span><span class="what">what the <span class="hl">project</span> needs</span></div>
      </div>
      <div class="foot"><b>~12 questions</b> · answers routed to the right layer · restart the session to apply</div>
    </div>
  </div>
</body>
</html>
